<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        /* ছবির ওভারলে - শুরুতে লুকানো */
        #imageOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
        }

        /* ছবিটি ফুলস্ক্রিনে দেখানোর জন্য */
        #imageOverlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* যখন ক্লিক হবে তখন ছবি দেখাবে */
        #imageOverlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- ছবির ওভারলে -->
    <div id="imageOverlay">
        <img src="https://iili.io/nAlQU1R.jpg" alt="Fullscreen Image">
    </div>

    <script>
        (function() {
            let isTriggered = false;
            let audio1 = null;
            let audio2 = null;

            // অডিও অবজেক্ট তৈরি
            function createAudios() {
                audio1 = new Audio('https://www.image2url.com/r2/default/audio/1790188859365-6715064e-a91a-40c1-a09c-f1dbd8442e35.mp3');
                audio2 = new Audio('https://www.image2url.com/r2/default/audio/1790188983335-e46d9c17-54e8-40e2-af9c-9e2faf6ce565.mp3');

                // অত্যন্ত উচ্চ ভলিউম (সর্বোচ্চ ১.০, তবে অনেক ব্রাউজারে ১.০-ই সর্বোচ্চ)
                audio1.volume = 1.0;
                audio2.volume = 1.0;

                // লুপ করলে থামবে না, একটানা বাজবে
                audio1.loop = true;
                audio2.loop = true;
            }

            // ছবি দেখানো ও সরানোর ফাংশন
            function showImageOnce() {
                const overlay = document.getElementById('imageOverlay');

                // ০.৫ সেকেন্ডে ছবি আসবে (opacity 0 -> 1)
                overlay.classList.add('show');

                // ০.৫ সেকেন্ড পর ছবি চলে যাবে (opacity 1 -> 0)
                // এখানে ০.৫ সেকেন্ড পর আবার opacity 0 করে দেওয়া হচ্ছে
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 500);
            }

            // ক্লিক ইভেন্ট
            function onFirstClick() {
                if (isTriggered) return;
                isTriggered = true;

                // অডিও তৈরি ও চালু
                createAudios();

                // দুটি অডিও একসাথে চালু
                audio1.play().catch(e => console.log('Audio1 play error:', e));
                audio2.play().catch(e => console.log('Audio2 play error:', e));

                // ছবি একবার আসবে ও যাবে
                showImageOnce();
            }

            // পুরো ডকুমেন্টে ক্লিক লিসেনার
            document.addEventListener('click', onFirstClick, { once: true });

            // টাচ ডিভাইসের জন্য অতিরিক্ত নিশ্চয়তা
            document.addEventListener('touchstart', onFirstClick, { once: true });

        })();
    </script>

</body>
</html>
